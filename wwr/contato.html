<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fale Conosco | Companhia de Rafting em Corredeiras</title>
    <meta name="description"
        content="Entre em contato com a Companhia de Rafting em Corredeiras. Envie uma mensagem ou localize nossa base em Foz do Iguaçu.">
    <link rel="stylesheet" href="rafting.css">
</head>

<body>

    <!-- Cabeçalho Principal -->
    <header class="main-header">
        <div class="header-container">
            <div class="logo-box">
                <!-- Ícone/Logo do Wireframe -->
                <div class="placeholder-icon">🏞️</div>
            </div>
            <nav class="main-nav">
                <ul>
                    <li><a href="index.html">Página Inicial</a></li>
                    <li><a href="sobre.html">Sobre Nós</a></li>
                    <li><a href="viagens.html">Viagens</a></li>
                    <li><a href="contato.html" class="active">Fale Conosco</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <!-- Conteúdo Principal -->
    <main class="content-wrapper">

        <!-- Título e Informações da Empresa -->
        <section class="company-heading">
            <h1>Companhia de Rafting em Corredeiras</h1>
            <address class="company-address">
                123 Rua Principal do Rio<br>
                Foz do Iguaçu, Paraná<br>
                <a href="tel:+5545999999999">+55 45 99999-9999</a><br>
                <a href="mailto:info@correiras.com">info@correiras.com</a>
            </address>
        </section>

        <!-- Seção Central: Mapa e Formulário lado a lado -->
        <section class="interactive-section">

            <!-- Bloco do Mapa (Esquerda) -->
            <div class="map-container">
                <!-- Iframe do Google Maps sem style="border:0" inline -->
                <iframe
                    src="https://www.google.com/maps/embed?pb=!1m14!1m12!1m3!1d68506.06675541592!2d-54.57449457567124!3d-25.524828935406905!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!5e0!3m2!1spt-BR!2sbr!4v1780625212840!5m2!1spt-BR!2sbr"
                    width="600" height="450" style="border:0;" allowfullscreen="" loading="lazy"
                    referrerpolicy="no-referrer-when-downgrade"></iframe>
            </div>

            <!-- Bloco do Formulário (Direita) -->
            <div class="form-container">
                <form action="#" method="POST" class="contact-form">

                    <div class="form-row">
                        <label for="name">Nome</label>
                        <input type="text" id="name" name="name" placeholder="Digite aqui" required>
                    </div>

                    <div class="form-row">
                        <label for="email">E-mail</label>
                        <input type="email" id="email" name="email" placeholder="Digite aqui" required>
                    </div>

                    <div class="form-row-radio">
                        <span class="radio-title">Propósito da Mensagem</span>
                        <div class="radio-group">
                            <label><input type="radio" name="purpose" value="geral" checked> Dúvida Geral</label>
                            <label><input type="radio" name="purpose" value="reserva"> Pergunta sobre Reserva</label>
                            <label><input type="radio" name="purpose" value="sugestao"> Sugestão</label>
                        </div>
                    </div>

                    <div class="form-row-textarea">
                        <label for="message">Mensagem</label>
                        <textarea id="message" name="message" rows="4" placeholder="Digite aqui" required></textarea>
                    </div>

                    <div class="form-row-checkbox">
                        <label>
                            <input type="checkbox" name="newsletter" value="sim"> Por favor, me inscreva na newsletter
                            mensal
                        </label>
                    </div>

                    <div class="form-row-submit">
                        <button type="submit" class="submit-btn">Entrar em Contato!</button>
                    </div>

                </form>
            </div>
        </section>

        <!-- Seção da Equipe (Inferior) -->
        <section class="team-section">
            <h2>Estamos Aqui para Servi-lo</h2>
            <div class="team-grid">

                <figure class="team-card">
                    <div class="avatar-placeholder">👤</div>
                    <figcaption>Perfil do Funcionário</figcaption>
                </figure>

                <figure class="team-card">
                    <div class="avatar-placeholder">👤</div>
                    <figcaption>Perfil do Funcionário</figcaption>
                </figure>

                <figure class="team-card">
                    <div class="avatar-placeholder">👤</div>
                    <figcaption>Perfil do Funcionário</figcaption>
                </figure>

            </div>
        </section>

    </main>

    <!-- Rodapé -->
    <footer>
        <nav class="socialmedia">
            <a href="https://facebook.com"><img src="imagens/facebook.png" alt="Ícone do Facebook"></a>
            <a href="https://linkedin.com"><img src="imagens/linkedin.png" alt="Ícone do Linkedin"></a>
            <a href="https://instagram.com"><img src="imagens/instagram.jpg" alt="Ícone do Instagram"></a>
        </nav>
        <p>&copy; 2026 Rafting Corredeiras | Marcelo Quadros</p>

    </footer>

</body>

</html>
